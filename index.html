<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bhopali Delights</title>
  <!-- Bootstrap 5.3 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    
    .brand-container {
      position: relative;
      height: 40px;
    }
    .custom-logo {
      position: absolute;
      top: 0;
      left: 0;
      width: 90px;
      height: auto;
      z-index: 1000;
    }
    @media (min-width: 992px) {
      .custom-logo {
        width: 100px;
      }
    }
    /* Mobile collapse menu styling taake text logo ke peeche na jaye */
    @media (max-width: 991.98px) {
      .navbar-collapse {
        background-color: #ffffff;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        padding: 20px;
        box-shadow: 0 10px 15px rgba(0,0,0,0.05);
        z-index: 999;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg custom-navbar bg-white shadow-normal py-2 position-relative">
    <div class="container d-flex justify-content-between align-items-center">
      
      <!-- Left: Logo Container -->
      <div class="brand-container position-relative h-25">
        <a class="navbar-brand p-0 m-0" href="#">
          <img src="Images/Layer 2.png" alt="Bhopali Delights" class="custom-logo">
        </a>
      </div>

      <!-- Right Side items for Mobile (Cart + Toggler) and Desktop -->
      <div class="d-flex align-items-center gap-3">
        <!-- Cart Icon -->
        <a href="http://127.0.0.1:5500/index.html" class="rounded-circle bg-danger text-white d-flex justify-content-center align-items-center text-decoration-none d-none" style="width: 40px; height: 50px;">
          <i class="bi bi-basket-fill"></i>
        </a>

        <!-- Mobile Toggler Button -->
        <button class="navbar-toggler border-0 shadow-none p-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <!-- Navbar Links and Actions Collapse -->
      <div class="collapse navbar-collapse justify-content-end align-items-center" id="navbarNav">
        <ul class="navbar-nav align-items-lg-center mb-3 mb-lg-0 me-lg-4">
          <li class="nav-item"><a class="nav-link active fw-medium px-3" href="http://127.0.0.1:5500/index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link fw-medium px-3" href="#">Menu</a></li>
          <li class="nav-item"><a class="nav-link fw-medium px-3" href="#">About</a></li>
          <li class="nav-item"><a class="nav-link fw-medium px-3" href="#">Contact</a></li>
        </ul>

        <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3">
          <!-- Delivery Order Info -->
          <div class="d-none d-lg-flex align-items-center text-dark text-decoration-none">
            <div class="rounded-circle bg-danger text-white d-flex justify-content-center align-items-center me-2" style="width: 35px; height: 35px;">
              <i class="bi bi-basket-fill"></i>
            </div>
            <div style="line-height: 1.2;">
              <small class="text-muted d-block" style="font-size: 11px;">Delivery Order</small>
              <span class="fw-bold text-danger" style="font-size: 14px;">+923142376378</span>
            </div>
          </div>

          <!-- Login Button -->
          <a href="#" class="btn btn-danger rounded-pill px-4 fw-medium text-center">Login</a>
        </div>
      </div>

    </div>
  </nav>

  <!-- Bootstrap 5.3 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
